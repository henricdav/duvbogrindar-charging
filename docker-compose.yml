version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: duvbogrindar-postgres
    environment:
      POSTGRES_DB: duvbogrindar_charging
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: duvbogrindar-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/duvbogrindar_charging
      PORT: 3001
      NODE_ENV: development
      EASEE_USERNAME: ${EASEE_USERNAME}
      EASEE_PASSWORD: ${EASEE_PASSWORD}
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: duvbogrindar-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:3001/api
    command: npm run dev

volumes:
  postgres_data:
